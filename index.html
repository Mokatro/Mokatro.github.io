  <style>
    @keyframes rotate-slow {
      from { transform: rotate(0deg); }

    }
    
    @keyframes rotate-slower {

        <a href="https://www.linkedin.com/in/logan-pierce-a48a61167/" target="_blank" rel="noopener noreferrer" class="text-gray-400 hover:text-white transition">

  <script>
    // Generate rays for SVG animations
    function generateRays(groupId, count, offset = 0) {
      const group = document.getElementById(groupId);
      if (!group) return;
      const gradientId = groupId.replace('rays', 'rayGlow');
      
      for (let i = 0; i < count; i++) {
        const angle = (i * 360 / count) + offset;
        const radians = (angle * Math.PI) / 180;
        const length = 200;
        
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', '250');
        line.setAttribute('y1', '175');
        line.setAttribute('x2', 250 + Math.cos(radians) * length);
        line.setAttribute('y2', 175 + Math.sin(radians) * length);
        line.setAttribute('stroke', `url(#${gradientId})`);
        line.setAttribute('stroke-width', '8');
        line.setAttribute('stroke-linecap', 'round');
        line.setAttribute('opacity', '0.3');
        
        group.appendChild(line);
      }
    }
    
    generateRays('rays1', 48);
    generateRays('rays2', 48, 3.75);
    generateRays('rays3', 48);
    generateRays('rays4', 48, 3.75);
    generateRays('rays5', 48);
    generateRays('rays6', 48, 3.75);

    // Dynamic highlight layout system
    class HighlightLayoutEngine {
      constructor(containerId, highlightImages, theme, layoutType = 'quad', mobileFirstImage = null) {
        this.container = document.getElementById(containerId);
        this.highlightContainer = document.getElementById(`${containerId.replace('-container', '')}-highlights`);
        this.buttonWrapper = document.getElementById(`${containerId.replace('-container', '')}-button-wrapper`);
        this.images = highlightImages;
        this.mobileFirstImage = mobileFirstImage; // Override first image on mobile
        this.theme = theme;
        this.layoutType = layoutType;
        this.highlights = [];
        this.imageData = [];
      }

      async loadImages() {
        const isMobile = window.innerWidth < 768;
        const imagesToLoad = (isMobile && this.mobileFirstImage) 
          ? [this.mobileFirstImage, ...this.images.slice(1)]
          : this.images;
          
        const promises = imagesToLoad.map((src, index) => {
          return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
              resolve({
                src,
                width: img.naturalWidth,
                height: img.naturalHeight,
                aspectRatio: img.naturalWidth / img.naturalHeight,
                index
              });
            };
            img.onerror = () => {
              resolve({
                src,
                width: 1,
                height: 1,
                aspectRatio: 1,
                index
              });
            };
            img.src = src;
          });
        });
        this.imageData = await Promise.all(promises);
      }

      calculateLayout() {
        const containerRect = this.container.getBoundingClientRect();
        
        const actualButton = this.buttonWrapper.querySelector('button');
        const buttonRect = actualButton ? actualButton.getBoundingClientRect() : this.buttonWrapper.getBoundingClientRect();
        
        const buttonCenterX = buttonRect.left + buttonRect.width / 2 - containerRect.left;
        const buttonCenterY = buttonRect.top + buttonRect.height / 2 - containerRect.top;
        
        const horizontalGap = 10;
        const verticalGap = 50;
        
        const edgePadding = 8;
        
        const isMobile = window.innerWidth < 768;
        
        let quadrants;
        let visibleImages;
        
        if (isMobile) {
          // Mobile: 1 image below button, full width
          // Button is at top, so image occupies space from bottom of button to bottom of container
          const buttonBottom = buttonRect.bottom - containerRect.top;
          visibleImages = this.imageData.slice(0, 1);
          quadrants = [
            {
              left: edgePadding,
              top: buttonBottom + 10, // Small gap below button
              right: containerRect.width - edgePadding,
              bottom: containerRect.height - edgePadding,
              anchorBottom: false
            }
          ];
        } else if (this.layoutType === 'vertical') {
          // Desktop vertical layout (Cup of Tea): 2 images, one above and one below
          visibleImages = this.imageData.slice(0, 2);
          quadrants = [
            { // Above button
              left: edgePadding,
              top: edgePadding,
              right: containerRect.width - edgePadding,
              bottom: buttonCenterY - verticalGap,
              anchorBottom: true
            },
            { // Below button
              left: edgePadding,
              top: buttonCenterY + verticalGap,
              right: containerRect.width - edgePadding,
              bottom: containerRect.height - edgePadding,
              anchorBottom: false
            }
          ];
        } else {
          // Desktop quad layout (HS and TFT): 4 quadrants
          visibleImages = this.imageData;
          quadrants = [
            { // Top-left
              left: edgePadding,
              top: edgePadding,
              right: buttonCenterX - horizontalGap,
              bottom: buttonCenterY - verticalGap,
              anchorBottom: true
            },
            { // Bottom-left
              left: edgePadding,
              top: buttonCenterY + verticalGap,
              right: buttonCenterX - horizontalGap,
              bottom: containerRect.height - edgePadding,
              anchorBottom: false
            },
            { // Top-right
              left: buttonCenterX + horizontalGap,
              top: edgePadding,
              right: containerRect.width - edgePadding,
              bottom: buttonCenterY - verticalGap,
              anchorBottom: true
            },
            { // Bottom-right
              left: buttonCenterX + horizontalGap,
              top: buttonCenterY + verticalGap,
              right: containerRect.width - edgePadding,
              bottom: containerRect.height - edgePadding,
              anchorBottom: false
            }
          ];
        }
        
        const layouts = [];
        
        visibleImages.forEach((imgData, idx) => {
          const quad = quadrants[idx % quadrants.length];
          const availWidth = quad.right - quad.left;
          const availHeight = quad.bottom - quad.top;
          
          const scaleWidth = availWidth / imgData.width;
          const scaleHeight = availHeight / imgData.height;
          
          let scale = Math.min(scaleWidth, scaleHeight);
          scale *= 0.99;
          
          let finalWidth = imgData.width * scale;
          let finalHeight = imgData.height * scale;
          
          const x = quad.left + (availWidth - finalWidth) / 2;
          let y;
          if (quad.anchorBottom) {
            y = quad.bottom - finalHeight;
          } else {
            y = quad.top;
          }
          
          layouts.push({
            src: imgData.src,
            x: Math.max(edgePadding, x),
            y: Math.max(edgePadding, y),
            width: finalWidth,
            height: finalHeight,
            index: imgData.index
          });
        });
        
        return layouts;
      }

      render() {
        const layouts = this.calculateLayout();
        this.highlightContainer.innerHTML = '';
        
        layouts.forEach(layout => {
          const div = document.createElement('div');
          div.className = `absolute bg-${this.theme.bgColor} border ${this.theme.borderSize} ${this.theme.borderColor} rounded-lg overflow-hidden shadow-xl transition-all duration-300`;
          div.style.left = `${layout.x}px`;
          div.style.top = `${layout.y}px`;
          div.style.width = `${layout.width}px`;
          div.style.height = `${layout.height}px`;
          
          const img = document.createElement('img');
          img.src = layout.src;
          img.alt = `Preview ${layout.index + 1}`;
          img.className = 'w-full h-full object-contain';
          
          div.appendChild(img);
          this.highlightContainer.appendChild(div);
        });
      }

      async init() {
        await this.loadImages();
        this.render();
      }

      resize() {
        this.render();
      }
    }

    // Initialize layouts
    const hearthstoneEngine = new HighlightLayoutEngine(
      'hearthstone-container',
      [
        '/highlights/hearthstone-1.png',
        '/highlights/hearthstone-2.png',
        '/highlights/hearthstone-3.png',
        '/highlights/hearthstone-4.png'
      ],
      {
        bgColor: 'amber-950',
        borderSize: 'border md:border-2',
        borderColor: 'border-yellow-600'
      },
      'quad',
      null  // No mobile override
    );

    const cupOfTeaEngine = new HighlightLayoutEngine(
      'cupoftea-container',
      [
        '/highlights/cupoftea-1.png',
        '/highlights/cupoftea-2.png'
      ],
      {
        bgColor: 'gray-900',
        borderSize: 'border md:border-2',
        borderColor: 'border-gray-600'
      },
      'vertical',
      null  // No mobile override
    );

    const tftEngine = new HighlightLayoutEngine(
      'tft-container',
      [
        '/highlights/tft-1.png',
        '/highlights/tft-2.png',
        '/highlights/tft-3.png',
        '/highlights/tft-4.png'
      ],
      {
        bgColor: 'indigo-950',
        borderSize: 'border md:border-2',
        borderColor: 'border-cyan-500'
      },
      'quad',
      '/highlights/tft-3.png'  // Use tft-3 for mobile only
    );

    // Initialize on load
    window.addEventListener('load', async () => {
      await hearthstoneEngine.init();
      await cupOfTeaEngine.init();
      await tftEngine.init();
    });

    // Handle resize
    let resizeTimeout;
    let wasMobile = window.innerWidth < 768;
    
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(async () => {
        const isMobile = window.innerWidth < 768;
        
        // If we crossed the mobile breakpoint, reload images
        if (isMobile !== wasMobile) {
          wasMobile = isMobile;
          await hearthstoneEngine.loadImages();
          await cupOfTeaEngine.loadImages();
          await tftEngine.loadImages();
        }
        
        hearthstoneEngine.resize();
        cupOfTeaEngine.resize();
        tftEngine.resize();
      }, 100);
    });
  </script>
